<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="A simple HTML5 boilerplate page" />
    <meta name="author" content="" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #scrollableWindow::-webkit-scrollbar {
            display: none;
        }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide">
</head>

<body>
    <header
        class="bg-[#164553] text-[#509CB2] text-3xl font-normal pt-[55px] text-center font-[Audiowide] tracking-wide h-[99px]">
        SC-LOADMASTER
    </header>
    <div class="bg-center bg-[url('./images/background-image-40.png')] bg-cover bg-fixed h-[678px] w-[393px]">
        <div id="scrollableWindow" class="ml-2 mr-2 overflow-y-auto h-full pb-[75px]"
            style="scrollbar-width: none; -ms-overflow-style: none;">
            <div id="page-title"
                class="text-[#509CB2] tracking-[7px] font-[Inter] font-bold text-center p-4 text-2xl mb-5">
                CONTRACTS</div>
            <div class="flex gap-2 items-center mb-5">
                <div id="set-ship-container" class="font-[Inter] text-white font-normal text-sm flex gap-4">
                    <div>
                        <label for="ship-name">SHIP</label>
                        <select id="ship-name" name="ship-name"
                            class="border-2 p-1 border-white rounded w-[137px] h-[30px] bg-gray-400 text-white">
                            <option value="">Select a ship</option>
                            <option value="argo-raft">ARGO RAFT</option>
                            <option value="argo-mole">ARGO MOLE</option>
                            <option value="misc-hull-a">MISC HULL A</option>
                        </select>
                    </div>
                    <div>
                        <label for="scu">MX CNTR SZ</label>
                        <select id="scu" name="scu"
                            class="border-2 p-1 border-white rounded h-[30px] w-[80px] bg-gray-400 text-white">
                            <option value="">Size</option>
                            <option value="1">1 SCU</option>
                            <option value="2">2 SCU</option>
                            <option value="4">4 SCU</option>
                            <option value="8">8 SCU</option>
                            <option value="16">16 SCU</option>
                        </select>
                    </div>
                </div>
            </div>
            <hr class="border-[#509CB2] border-2 mb-3">
            <div class="text-[Inter] text-sm text-white flex gap-2 mb-5">
                <div class="flex flex-col">
                    <span class="mb-2">COLLECT</span>
                    <input type="text" id="scu" name="scu"
                        class="border-2 p-1 border-white rounded h-[30px] bg-gray-400">
                </div>
                <div class="flex flex-col">
                    <span class="mb-2">DELIVER</span>
                    <input type="text" id="scu" name="scu"
                        class="border-2 p-1 border-white rounded h-[30px] bg-gray-400">
                </div>
            </div>
            <div class="text-[Inter] text-sm text-white flex gap-2 mb-5">
                <div class="flex flex-col">
                    <span class="mb-2">COMMODITY</span>
                    <input type="text" id="scu" name="scu"
                        class="border-2 p-1 border-white rounded h-[30px] w-[200px] bg-gray-400">
                </div>
                <div class="flex flex-col">
                    <span class="mb-2">SCU</span>
                    <div class="flex gap-2">
                        <input type="text" id="scu" name="scu"
                            class="border-2 p-1 border-white rounded h-[30px] w-[80px] bg-gray-400">
                        <button id="add-route-button" type="button">
                            <img class="w-[20px] h-[20px]" src="./images/plus-circle.png">
                        </button>
                    </div>
                </div>
            </div>
            <hr class="border-[#509CB2] border-2 mb-5">
            <table class="text-sm text-[Inter] text-white border-separate border-spacing-2 mb-5">
                <tr>
                    <td>
                        <button id="remove-route-1-button" type="button">
                            <img class="w-[20px] h-[20px]" src="./images/minus-circle.png">
                        </button>
                    </td>
                    <td>
                        <span class="block truncate min-w-0 max-w-[80px]">Everus Harbor</span>
                    </td>
                    <td>
                        <span class="block truncate min-w-0 max-w-[80px]">HUR-L2 Faithful Dream Station</span>
                    </td>
                    <td>
                        <span class="block truncate min-w-0 max-w-[80px]">Preassurized Ice</span>
                    </td>
                    <td>
                        <span>146</span>
                    </td>
                    <td>
                        <button id="add-route-to-run-1-button" type="button">
                            <img class="w-[20px] h-[20px]" src="./images/arrow-down-circle.png">
                        </button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button id="remove-route-2-button" type="button">
                            <img class="w-[20px] h-[20px]" src="./images/minus-circle.png">
                        </button>
                    </td>
                    <td>
                        <span class="block truncate min-w-0 max-w-[80px]">Everus Harbor</span>
                    </td>
                    <td>
                        <span class="block truncate min-w-0 max-w-[80px]">Lorville</span>
                    </td>
                    <td>
                        <span class="block truncate min-w-0 max-w-[80px]">Quartz</span>
                    </td>
                    <td>
                        <span>27</span>
                    </td>
                    <td>
                        <button id="add-route-to-run-2-button" type="button">
                            <img class="w-[20px] h-[20px]" src="./images/arrow-down-circle.png">
                        </button>
                    </td>
                </tr>
            </table>
            <div id="route-card-1" class="mb-5">
                <div id="route-card-header-1"
                    class="border-[#509CB2] rounded-tl-lg border-2 mb-0 text-[#509CB2] text-[Inter] text-sm font-bold bg-[#164553] p-1">
                    <span class="ml-2">Everus Harbor → HUR-L2 Faithful Dream Station</span>
                </div>
                <div id="route-card-body-1"
                    class="border-[#509CB2] border-l-2 border-r-2 mb-0 text-[#509CB2] text-[Inter] text-sm font-medium bg-[#1C3741] p-2">
                    <div id="route-info" class="flex items-center gap-2">
                        <button id="return-route-to-list-1-button" type="button" class="flex-none">
                            <img class="w-[20px] h-[20px]" src="./images/arrow-up-circle.png">
                        </button>
                        <span id="commodity-type" class="flex-1 min-w-0 truncate">Pressurized Ice</span>
                        <span id="scu-qty" class="flex-none w-[25px] text-right">123</span>
                        <button id="completed-route-1-button" type="button" class="flex-none ml-auto">
                            <img class="w-[20px] h-[20px]" src="./images/save.png">
                        </button>
                    </div>
                    <div class="mt-2 ml-10 flex gap-2">
                        <img src="./images/container-badge/cargo-container-badge-16-7.png">
                        <img src="./images/container-badge/cargo-container-badge-8-1.png">
                        <img src="./images/container-badge/cargo-container-badge-2-1.png">
                        <img src="./images/container-badge/cargo-container-badge-1-1.png">
                    </div>
                    <hr class="border-[#509CB2] border-1 mt-2">
                </div>
                <div
                    class="border-[#509CB2] rounded-br-lg border-l-2 border-r-2 border-b-2 mb-0 text-[#509CB2] text-[Inter] text-sm font-medium bg-[#1C3741] p-2">
                    <div id="route-info" class="flex items-center gap-2">
                        <button id="return-route-to-list-1-button" type="button" class="flex-none">
                            <img class="w-[20px] h-[20px]" src="./images/arrow-up-circle.png">
                        </button>
                        <span id="commodity-type" class="flex-1 min-w-0 truncate">Quartz</span>
                        <span id="scu-qty" class="flex-none w-[25px] text-right">53</span>
                        <button id="completed-route-1-button" type="button" class="flex-none ml-auto">
                            <img class="w-[20px] h-[20px]" src="./images/save.png">
                        </button>
                    </div>
                    <div class="mt-2 ml-10 flex gap-2">
                        <img src="./images/container-badge/cargo-container-badge-16-3.png">
                        <img src="./images/container-badge/cargo-container-badge-4-1.png">
                        <img src="./images/container-badge/cargo-container-badge-1-1.png">
                    </div>
                </div>
            </div>
            <div id="route-card-2" class="mb-5">
                <div id="route-card-header-2"
                    class="border-[#509CB2] rounded-tl-lg border-2 mb-0 text-[#509CB2] text-[Inter] text-sm font-bold bg-[#164553] p-1">
                    <span class="ml-2">Everus Harbor → HUR-L1 Green Glade Station</span>
                </div>
                <div id="route-card-body-2"
                    class="border-[#509CB2] border-l-2 border-r-2 mb-0 text-[#509CB2] text-[Inter] text-sm font-medium bg-[#1C3741] p-2">
                    <div id="route-info" class="flex items-center gap-2">
                        <button id="return-route-to-list-2-button" type="button" class="flex-none">
                            <img class="w-[20px] h-[20px]" src="./images/arrow-up-circle.png">
                        </button>
                        <span id="commodity-type" class="flex-1 min-w-0 truncate">Pressurized Ice</span>
                        <span id="scu-qty" class="flex-none w-[30px] text-right">67</span>
                        <button id="completed-route-2-button" type="button" class="flex-none ml-auto">
                            <img class="w-[20px] h-[20px]" src="./images/save.png">
                        </button>
                    </div>
                    <div class="mt-2 ml-10 flex gap-2">
                        <img src="./images/container-badge/cargo-container-badge-16-4.png">
                        <img src="./images/container-badge/cargo-container-badge-2-1.png">
                        <img src="./images/container-badge/cargo-container-badge-1-1.png">
                    </div>
                    <hr class="border-[#509CB2] border-1 mt-2">
                </div>
                <div
                    class="border-[#509CB2] rounded-br-lg border-l-2 border-r-2 border-b-2 mb-0 text-[#509CB2] text-[Inter] text-sm font-medium bg-[#1C3741] p-2">
                    <div id="route-info" class="flex items-center gap-2">
                        <button id="return-route-to-list-2-button" type="button" class="flex-none">
                            <img class="w-[20px] h-[20px]" src="./images/arrow-up-circle.png">
                        </button>
                        <span id="commodity-type" class="flex-1 min-w-0 truncate">Quartz</span>
                        <span id="scu-qty" class="flex-none w-[30px] text-right">48</span>
                        <button id="completed-route-2-button" type="button" class="flex-none ml-auto">
                            <img class="w-[20px] h-[20px]" src="./images/save.png">
                        </button>
                    </div>
                    <div class="mt-2 ml-10 flex gap-2">
                        <img src="./images/container-badge/cargo-container-badge-16-3.png">
                    </div>
                </div>
            </div>
        </div>
        <footer class="bg-[#164553]
             h-[75px]
             fixed
             inset-x-0
             bottom-0
             p-4">
            <div class="flex gap-20 justify-center items-center">
                <img src="./images/contract.png">
                <a href="./log.html">
                    <img src="./images/log.png">
                </a>
                <a href="./ship.html">
                    <img src="./images/ships.png">
                </a>
            </div>
        </footer>
</body>

</html>
